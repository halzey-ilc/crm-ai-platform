# Local development stack for the AI Platform. Independent of the CRM stack:
# own project name, own network, own PostgreSQL (host port 55432) — it does
# not touch the CRM's containers, databases or RabbitMQ.
#
#   make env   # once: generates ../../.env with random secrets
#   make up
name: crm-ai-platform

x-app-env: &app-env
  AI_ENV: ${AI_ENV:-local}
  AI_LOG_LEVEL: ${AI_LOG_LEVEL:-info}
  AI_MODEL_PROVIDERS: mock
  AI_DATABASE_URL: postgres://ai_app:${AI_DB_APP_PASSWORD:?run make env}@postgres:5432/crm_ai?sslmode=disable

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: crm_ai
      POSTGRES_USER: ai_owner
      POSTGRES_PASSWORD: ${AI_DB_OWNER_PASSWORD:?run make env}
    ports: ["127.0.0.1:55432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_owner -d crm_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build: { context: ../.., dockerfile: deployments/docker/Dockerfile, target: migrate }
    image: crm-ai-platform/migrate:local
    environment:
      AI_DATABASE_OWNER_URL: postgres://ai_owner:${AI_DB_OWNER_PASSWORD}@postgres:5432/crm_ai?sslmode=disable
      AI_DB_APP_PASSWORD: ${AI_DB_APP_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  gateway:
    build: { context: ../.., dockerfile: deployments/docker/Dockerfile, target: gateway }
    image: crm-ai-platform/gateway:local
    environment:
      <<: *app-env
      AI_HTTP_ADDR: ":8090"
      AI_AUTH_HS256_KEY: ${AI_AUTH_HS256_KEY:?run make env}
    ports: ["127.0.0.1:8090:8090"]
    # crm-link is the only network the CRM joins (see crm-platform/compose.ai.yaml):
    # it contains the gateway alone, so the CRM can reach nothing else here and
    # names like "postgres" never resolve across the two stacks.
    networks: [default, crm-link]
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

  orchestrator:
    build: { context: ../.., dockerfile: deployments/docker/Dockerfile, target: orchestrator }
    image: crm-ai-platform/orchestrator:local
    environment:
      <<: *app-env
      AI_WORKER_CONCURRENCY: "4"
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped

networks:
  crm-link:
    name: crm-ai-link

volumes:
  pgdata:
