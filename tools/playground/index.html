<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Platform: песочница</title>
<style>
:root { --bg:#fbfbfa; --card:#fff; --ink:#1b1b1a; --muted:#6b6a66; --line:#e3e2dc; --accent:#2a6fd6;
  --accent-bg:#e8f0fc; --ok:#1f7a3a; --ok-bg:#e6f4ea; --warn:#8a5a00; --warn-bg:#fdf3dd; --bad:#a32d2d; --bad-bg:#fbeaea; }
@media (prefers-color-scheme: dark) {
  :root { --bg:#161615; --card:#1f1f1e; --ink:#eeede9; --muted:#a3a29c; --line:#34332f; --accent:#6ea3f0;
    --accent-bg:#1c2a40; --ok:#7fd096; --ok-bg:#183222; --warn:#f0c46a; --warn-bg:#3a2d10; --bad:#f09595; --bad-bg:#3d1b1b; }
}
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
.grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; }
@media (max-width: 860px) { .grid { grid-template-columns: minmax(0,1fr); } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
label { display:block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
select, textarea, button { font: inherit; color: inherit; }
select { width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
textarea { width: 100%; min-height: 360px; padding: 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); font: 13px/1.5 ui-monospace, Consolas, monospace; resize: vertical; }
.row { display:flex; gap: 10px; align-items:center; margin-top: 12px; flex-wrap: wrap; }
button { padding: 9px 18px; border-radius: 8px; border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
button.ghost { background: transparent; color: var(--accent); }
.desc { font-size: 14px; color: var(--muted); margin: 10px 0 0; }
.status { font-size: 14px; color: var(--muted); }
.badge { display:inline-block; font-size: 12px; padding: 2px 8px; border-radius: 6px; margin-right: 6px; }
.b-ok { background: var(--ok-bg); color: var(--ok); } .b-warn { background: var(--warn-bg); color: var(--warn); }
.b-bad { background: var(--bad-bg); color: var(--bad); } .b-info { background: var(--accent-bg); color: var(--accent); }
.empty { color: var(--muted); font-size: 14px; }
.f { margin: 0 0 12px; }
.f > .k { font-size: 12px; color: var(--muted); text-transform: none; margin-bottom: 2px; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0 0 8px; }
.item .f { margin-bottom: 6px; }
blockquote { margin: 2px 0; padding: 4px 10px; border-left: 3px solid var(--accent); color: var(--muted); font-style: italic; }
.chip { display:inline-block; font: 12px ui-monospace, Consolas, monospace; background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 1px 6px; margin: 0 4px 4px 0; }
details { margin-top: 14px; } summary { cursor: pointer; color: var(--muted); font-size: 13px; }
pre { white-space: pre-wrap; word-break: break-word; font: 12px/1.45 ui-monospace, Consolas, monospace; background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
.err { color: var(--bad); background: var(--bad-bg); border-radius: 8px; padding: 8px 10px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Песочница AI Platform</h1>
  <p class="sub">Выберите пример, при желании измените его и отправьте модели. Только выдуманные данные: всё, что здесь введено, уходит в модель и сохраняется как задача.</p>
  <div class="grid">
    <section class="card">
      <label for="example">Пример</label>
      <select id="example"></select>
      <p class="desc" id="desc"></p>
      <label for="input" style="margin-top:12px">Вход (JSON)</label>
      <textarea id="input" spellcheck="false"></textarea>
      <div class="row">
        <button id="send">Отправить</button>
        <button class="ghost" id="reset">Вернуть пример</button>
        <span class="status" id="status"></span>
      </div>
    </section>
    <section class="card">
      <label>Ответ</label>
      <div id="result"><p class="empty">Здесь появится ответ. На этом компьютере без GPU он занимает 30–60 секунд.</p></div>
    </section>
  </div>
</main>
<script>
const TYPES = {
  "call.summary.v2": "Резюме звонка: главное, ключевые пункты с цитатами, следующий шаг.",
  "kpi.explanation.v1": "Объяснение KPI: что изменилось и что делать. Числа только из входа.",
  "message.reply.v1": "Черновик ответа клиенту: намерение, срочность, цитата-доказательство.",
  "deal.coach.v1": "Подготовка к разговору по сделке: ситуация, риски, вопросы, следующий шаг.",
  "risk.review.v1": "Сигналы риска: нейтральное объяснение и что проверить, без обвинений.",
  "operations.digest.v1": "Сводка: забытые лиды, просроченные задачи, сделки без шага.",
  "knowledge.answer.v1": "Ответ по документам: только утверждения с дословными цитатами.",
  "agent.plan.v2": "Агент: предлагает действия в CRM. Ничего не выполняет без подтверждения."
};
const LABELS = {
  summary:"Резюме", key_points:"Ключевые пункты", next_step:"Следующий шаг", text:"Текст", evidence_quote:"Цитата",
  headline:"Заголовок", observations:"Наблюдения", recommendations:"Рекомендации", items:"Пункты", checks:"Что проверить",
  intent:"Намерение", urgency:"Срочность", evidence:"Доказательство", quote:"Цитата", message_ref:"Сообщение",
  draft_reply:"Черновик ответа", needs_human:"Нужен человек", situation:"Ситуация", risks:"Риски", questions:"Вопросы клиенту",
  actions:"Предложенные действия", tool:"Действие", reason:"Почему", title:"Название", due_date:"Срок", start:"Начало",
  duration_minutes:"Минут", stage:"Этап", body:"Текст заметки", subject_ref:"Запись", statements:"Утверждения",
  passage_ref:"Фрагмент", refs:"Ссылки", finding_refs:"Ссылки", signal_refs:"Ссылки", metric_codes:"Показатели", kind:"Тип",
  insufficient_data:"Недостаточно данных", requires_confirmation:"Нужно подтверждение", is_evidence:"Это доказательство"
};
const TOOLS = { create_task:"Создать задачу", log_note:"Записать заметку", request_deal_brief:"Подготовить справку",
  schedule_meeting:"Назначить встречу", move_deal_stage:"Сменить этап сделки" };
const SKIP = new Set(["schema","generator","language"]);
const QUOTES = new Set(["quote","evidence_quote"]);
let examples = [], timer = null;
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function render(v, key) {
  if (v === null || v === undefined || (Array.isArray(v) && v.length === 0)) return el("span", "empty", "—");
  if (typeof v === "boolean") return el("span", "badge " + (v ? "b-warn" : "b-info"), v ? "да" : "нет");
  if (typeof v !== "object") {
    if (QUOTES.has(key)) return el("blockquote", null, String(v));
    if (key === "tool") return el("span", "badge b-ok", TOOLS[v] || v);
    if (/_ref$/.test(key)) return el("span", "chip", String(v));
    return el("div", null, String(v));
  }
  if (Array.isArray(v)) {
    const box = el("div");
    v.forEach(x => {
      if (x && typeof x === "object") { const it = el("div", "item"); it.append(renderObj(x)); box.append(it); }
      else box.append(el("span", "chip", String(x)));
    });
    return box;
  }
  return renderObj(v);
}
function renderObj(o) {
  const box = el("div");
  for (const [k, v] of Object.entries(o)) {
    if (SKIP.has(k)) continue;
    const f = el("div", "f");
    f.append(el("div", "k", LABELS[k] || k), render(v, k));
    box.append(f);
  }
  return box;
}

function showResult(job) {
  const out = $("result"); out.innerHTML = "";
  const head = el("div", "row"); head.style.marginTop = "0";
  if (job.status === "succeeded") {
    const o = job.result.output || {};
    head.append(el("span", "badge b-ok", "готово"));
    if (o.insufficient_data) head.append(el("span", "badge b-warn", "недостаточно данных"));
    head.append(el("span", "status", job.result.model + " · " + secs(job) + " с"));
    out.append(head, renderObj(o));
  } else {
    head.append(el("span", "badge b-bad", job.status === "failed" ? "ошибка" : job.status));
    out.append(head);
    if (job.error) out.append(el("p", "err", job.error.code + ": " + job.error.message));
  }
  const d = el("details"); d.append(el("summary", null, "Полный ответ платформы (JSON)"), el("pre", null, JSON.stringify(job, null, 2)));
  out.append(d);
}
const secs = j => j.started_at && j.finished_at ? Math.round((new Date(j.finished_at) - new Date(j.started_at)) / 1000) : "?";

function pick() {
  const ex = examples[$("example").value]; if (!ex) return;
  $("input").value = JSON.stringify(ex.input, null, 2);
  $("desc").textContent = TYPES[ex.type] || ex.type;
}

async function send() {
  const ex = examples[$("example").value];
  let input;
  try { input = JSON.parse($("input").value); } catch (e) { $("status").textContent = "Вход — не JSON: " + e.message; return; }
  $("send").disabled = true;
  const t0 = Date.now();
  clearInterval(timer);
  timer = setInterval(() => { $("status").textContent = "Модель думает… " + Math.round((Date.now() - t0) / 1000) + " с"; }, 1000);
  try {
    const r = await fetch("/api/run", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ type: ex.type, input }) });
    let job = await readJob(r);
    while (job.status === "queued" || job.status === "running" || job.status === "retrying") {
      await new Promise(res => setTimeout(res, 2000));
      job = await readJob(await fetch("/api/jobs/" + job.id));
    }
    showResult(job);
    $("status").textContent = "";
  } catch (e) {
    $("result").innerHTML = ""; $("result").append(el("p", "err", e.message)); $("status").textContent = "";
  } finally { clearInterval(timer); $("send").disabled = false; }
}
async function readJob(r) {
  const text = await r.text();
  let j; try { j = JSON.parse(text); } catch { throw new Error(text || ("HTTP " + r.status)); }
  if (!r.ok) throw new Error((j.error && (j.error.code + ": " + j.error.message + (j.error.details ? "\n" + j.error.details.join("\n") : ""))) || ("HTTP " + r.status));
  return j;
}

(async () => {
  examples = await (await fetch("/api/examples")).json();
  const sel = $("example"); let group = null, last = "";
  examples.forEach((ex, i) => {
    if (ex.type !== last) { group = el("optgroup"); group.label = ex.type; sel.append(group); last = ex.type; }
    const o = el("option", null, ex.id + (ex.language ? " (" + ex.language + ")" : "")); o.value = i; group.append(o);
  });
  sel.onchange = pick; $("reset").onclick = pick; $("send").onclick = send;
  pick();
})();
</script>
</body>
</html>
